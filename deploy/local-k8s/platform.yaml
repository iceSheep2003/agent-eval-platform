apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eval-loom-data
  namespace: eval-loom
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-loom
  namespace: eval-loom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval-loom
  template:
    metadata:
      labels:
        app: eval-loom
    spec:
      containers:
        - name: platform
          image: eval-loom:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          env:
            - name: EVAL_LOOM_ENV
              value: production
            - name: RUNTIME_BACKEND
              value: local
            - name: EVAL_LOOM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: eval-loom-secrets
                  key: master-key
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8787
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: eval-loom-data
---
apiVersion: v1
kind: Service
metadata:
  name: eval-loom
  namespace: eval-loom
spec:
  type: NodePort
  selector:
    app: eval-loom
  ports:
    - port: 8787
      targetPort: 8787
      nodePort: 30087
