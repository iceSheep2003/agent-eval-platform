[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-sdk"
version = "0.1.0"
description = "Python-first tracing and offline evaluation SDK for AI agents"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Agent Evaluation SDK Contributors" }]
dependencies = []

[project.optional-dependencies]
http = []
pytest = ["pytest>=8"]
deepeval = ["deepeval>=2.0"]
platform = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=42",
]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_eval = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
# 未 await 的协程只产生 RuntimeWarning、不报错——`AsyncSession.merge` 漏 await
# 会让写库静默失效。把它升级成失败，这类 bug 就不会再溜过去。
filterwarnings = ["error::RuntimeWarning"]
