; Alembic 配置。
;
; 单一环境 + 按模块 branch_labels（见 docs/backend-roadmap.md §2）：
;   每个模块的迁移文件带 branch_labels = ("identity",) / ("asset",) / ("platform",)，
;   用 `alembic upgrade identity@head` 单独升级某模块。
;   这样并行开发不会因为线性 revision 撞号而被迫 merge。
;
; 用法（在仓库根目录执行）：
;   .venv/bin/python -m alembic -c backend/alembic.ini upgrade heads
;   ALEMBIC_MODULE=asset .venv/bin/python -m alembic -c backend/alembic.ini upgrade asset@head

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
